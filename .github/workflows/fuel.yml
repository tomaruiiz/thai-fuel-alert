name: Thailand Fuel Price News Monitor

on:
  schedule:
    - cron: '*/30 * * * *'   # ทุก 30 นาที (0, 30) = 48 runs/day
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download previous DB (if exists)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: fuel-news-db
          path: .

      - name: Run News Monitor
        env:
          EASYSEND_API_KEY: ${{ secrets.EASYSEND_API_KEY }}
          ALERT_PHONE: ${{ secrets.ALERT_PHONE }}
        run: python news_monitor.py

      - name: Upload updated DB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuel-news-db
          path: fuel_news.db
          retention-days: 30